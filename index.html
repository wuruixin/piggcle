<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小猪的习惯日记 | 10月打卡盖章</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
        color: #5a4a4e;
        background: url("小猪的习惯日记.png") no-repeat center center;
        background-size: cover;
        background-attachment: fixed;
        padding: 24px 16px 40px;
        position: relative;
        overflow-x: hidden;
    }

    body::before,
    body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(40px);
        opacity: 0.45;
        z-index: 0;
        pointer-events: none;
    }

    body::before {
        width: 320px;
        height: 320px;
        background: #ffd6e4;
        top: -80px;
        left: -60px;
    }

    body::after {
        width: 380px;
        height: 380px;
        background: #ffe3cf;
        bottom: -100px;
        right: -80px;
    }

    .floating-blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(50px);
        opacity: 0.35;
        z-index: 0;
        pointer-events: none;
    }

    .blob-1 {
        width: 260px;
        height: 260px;
        background: #ffc9dd;
        top: 40%;
        left: 55%;
    }

    .blob-2 {
        width: 200px;
        height: 200px;
        background: #fff1d6;
        top: 60%;
        left: 10%;
    }

    .container {
        position: relative;
        z-index: 1;
        max-width: 720px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 28px;
        padding: 28px 22px 24px;
        box-shadow:
            0 18px 45px rgba(255, 182, 193, 0.25),
            0 8px 20px rgba(255, 210, 180, 0.18),
            inset 0 0 0 1px rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(8px);
    }

    .page-title {
        text-align: center;
        font-size: 26px;
        letter-spacing: 2px;
        color: #b58390;
        margin-bottom: 6px;
    }

    .page-subtitle {
        text-align: center;
        font-size: 13px;
        color: #c9aab3;
        margin-bottom: 22px;
        letter-spacing: 1px;
    }

    .tool-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-bottom: 24px;
        flex-wrap: wrap;
    }

    .tool-label {
        font-size: 14px;
        color: #b58390;
    }

    .stamp-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
    }

    .stamp-name {
        font-size: 12px;
        color: #a07885;
    }

    .stamp-preview {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        border: 2px solid #fff;
        box-shadow:
            0 6px 14px rgba(255, 182, 193, 0.35),
            inset 0 0 0 1px rgba(255, 255, 255, 0.6);
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .stamp-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .stamp-preview.active {
        transform: translateY(-4px) scale(1.04);
        box-shadow:
            0 10px 20px rgba(255, 140, 170, 0.45),
            0 0 0 3px rgba(255, 192, 210, 0.9);
    }

    /* 31天打卡网格，一天一格！！ */
    .check-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 10px;
    }

    .day-box {
        position: relative;
        aspect-ratio: 1 / 1;
        text-align: center;
        border-radius: 18px;
        background: rgba(255, 253, 245, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.9);
        cursor: pointer;
        transition: background 0.2s ease, transform 0.18s ease;
        box-shadow:
            inset 0 0 14px rgba(255, 228, 235, 0.55),
            0 4px 10px rgba(255, 205, 215, 0.25);
        overflow: hidden;
    }

    .day-box:hover {
        background: rgba(255, 218, 230, 0.85);
        transform: translateY(-2px);
    }

    .day-num {
        position: absolute;
        top: 7px;
        left: 10px;
        font-size: 14px;
        color: #9d7a84;
        font-weight: 600;
        z-index: 2;
        background: rgba(255, 255, 255, 0.5);
        padding: 1px 7px;
        border-radius: 10px;
    }

    .stamp-img {
        position: absolute;
        top: 52%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 78%;
        height: 78%;
        object-fit: contain;
        pointer-events: none;
        z-index: 1;
        filter: drop-shadow(0 4px 8px rgba(255, 140, 170, 0.35));
    }

    .reset-btn {
        display: block;
        margin: 24px auto 0;
        padding: 10px 24px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #ffc9dd, #ffb3c6);
        color: #fff;
        font-size: 14px;
        letter-spacing: 2px;
        cursor: pointer;
        box-shadow:
            0 10px 22px rgba(255, 150, 180, 0.45),
            inset 0 0 0 1px rgba(255, 255, 255, 0.6);
        transition: transform 0.2s ease;
    }

    .reset-btn:hover {
        transform: translateY(-2px);
    }

    @media (max-width: 480px) {
        .page-title {
            font-size: 22px;
        }
        .day-num {
            font-size: 12px;
            top: 5px;
            left: 7px;
        }
        .stamp-preview {
            width: 64px;
            height: 64px;
        }
    }
</style>
</head>
<body>
    <div class="floating-blob blob-1"></div>
    <div class="floating-blob blob-2"></div>

    <div class="container">
        <h1 class="page-title">小猪的习惯日记</h1>
        <p class="page-subtitle">2026年10月 · 日日打卡 慢慢坚持</p>

        <div class="tool-bar">
            <span class="tool-label">选择印章</span>
            <div class="stamp-item">
                <div class="stamp-preview active" id="stamp1">
                    <img src="1.png" alt="吃咪咪" />
                </div>
                <span class="stamp-name">吃咪咪</span>
            </div>
            <div class="stamp-item">
                <div class="stamp-preview" id="stamp2">
                    <img src="2.png" alt="就看看" />
                </div>
                <span class="stamp-name">就看看</span>
            </div>
        </div>

        <!-- 这里就是31个打卡格子，一天一格！ -->
        <div class="check-grid" id="grid-container"></div>

        <button class="reset-btn" onclick="clearAllStamp()">清空打卡记录</button>
    </div>

<script>
    const dayCount = 31;
    // 两枚印章
    const stampList = [
        "1.png",  // 吃咪咪
        "2.png"   // 就看看
    ];

    let currentStampIndex = 0;
    let stampData = JSON.parse(localStorage.getItem("octStampData")) || {};

    const stamp1 = document.getElementById("stamp1");
    const stamp2 = document.getElementById("stamp2");

    function setActiveStamp(index) {
        currentStampIndex = index;
        document.querySelectorAll(".stamp-preview").forEach((el) => el.classList.remove("active"));
        if (index === 0) {
            stamp1.classList.add("active");
        } else {
            stamp2.classList.add("active");
        }
    }

    stamp1.addEventListener("click", () => setActiveStamp(0));
    stamp2.addEventListener("click", () => setActiveStamp(1));

    function renderGrid() {
        const container = document.getElementById("grid-container");
        container.innerHTML = "";
        // 循环生成1~31，每一天都有格子
        for(let day = 1; day <= dayCount; day++){
            const box = document.createElement("div");
            box.className = "day-box";
            box.dataset.day = day;
            box.innerHTML = `<span class="day-num">${day}</span>`;

            if (stampData[day]) {
                const img = document.createElement("img");
                img.src = stampData[day];
                img.className = "stamp-img";
                box.appendChild(img);
            }

            box.addEventListener("click", function () {
                const d = this.dataset.day;
                if (stampData[d]) {
                    delete stampData[d];
                } else {
                    stampData[d] = stampList[currentStampIndex];
                }
                localStorage.setItem("octStampData", JSON.stringify(stampData));
                renderGrid();
            });
            container.appendChild(box);
        }
    }

    function clearAllStamp() {
        if (confirm("确定清空本月所有打卡记录吗？")) {
            stampData = {};
            localStorage.removeItem("octStampData");
            renderGrid();
        }
    }

    renderGrid();
</script>
</body>
</html>
